name: Security CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ====================
  # BUILD JOB
  # ====================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build
      
      - name: Run basic tests
        run: |
          echo "✅ Build completed successfully"

  # ====================
  # SAST - STATIC ANALYSIS
  # ====================
  sast-scan:
    name: SAST - Static Code Analysis
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/nodejs
            p/react
          generateSarif: true
        continue-on-error: true
      
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: semgrep.sarif
      
      - name: Check for critical vulnerabilities
        run: |
          if [ -f semgrep.sarif ]; then
            CRITICAL_COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
            echo "Critical vulnerabilities found: $CRITICAL_COUNT"
            
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "❌ SAST Failed: $CRITICAL_COUNT critical vulnerabilities detected"
              jq '.runs[].results[] | select(.level == "error") | {rule: .ruleId, message: .message.text, location: .locations[0].physicalLocation.artifactLocation.uri}' semgrep.sarif
              exit 1
            fi
          fi
          echo "✅ SAST Passed: No critical vulnerabilities" 