name: Security CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ====================
  # BUILD JOB
  # ====================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build
      
      - name: Run basic tests
        run: |
          echo "✅ Build completed successfully"

  # ====================
  # SAST - STATIC ANALYSIS
  # ====================
  sast-scan:
    name: SAST - Static Code Analysis
    runs-on: ubuntu-latest
    needs: build
    permissions:
        contents: read
        security-events: write

    steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Install Semgrep
          run: |
            python3 -m pip install semgrep

        - name: Run Semgrep (SARIF output)
          run: |
            semgrep --config p/security-audit \
                    --config p/owasp-top-ten \
                    --config p/javascript \
                    --config p/typescript \
                    --config p/nodejs \
                    --config p/react \
                    --sarif --output semgrep.sarif || true

        - name: Upload SARIF to GitHub Security
          uses: github/codeql-action/upload-sarif@v4
          if: always()
          with:
            sarif_file: semgrep.sarif

        - name: Check for critical vulnerabilities
          run: |
            if [ ! -f semgrep.sarif ]; then
            echo "❌ SARIF file missing. Semgrep did not produce output."
            exit 1
            fi

            CRITICAL_COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
            echo "Critical vulnerabilities found: $CRITICAL_COUNT"

            if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ SAST Failed: $CRITICAL_COUNT critical vulnerabilities detected"
            jq '.runs[].results[] | select(.level == "error") |
                {rule: .ruleId, message: .message.text,
                location: .locations[0].physicalLocation.artifactLocation.uri}' semgrep.sarif
            exit 1
            fi

            echo "✅ SAST Passed: No critical vulnerabilities"

  # ====================
  # SCA - DEPENDENCY ANALYSIS
  # ====================
  sca-scan:
    name: SCA - Dependency Security
    runs-on: ubuntu-latest
    needs: build
    strategy:
        matrix:
            include:
                - component: backend
                  path: backend
                - component: frontend
                  path: frontend
                
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
            cache: 'npm'

        - name: Install dependencies
          working-directory: ./${{ matrix.component }}
          run: |
            if [ ! -f package-lock.json ]; then
            echo "⚠️ No package-lock.json found — skipping npm cache for ${{ matrix.component }}"
            fi
            npm ci

        - name: Run npm audit
          working-directory: ./${{ matrix.component }}
          run: npm audit --audit-level=high --json > npm-audit-${{ matrix.component }}.json || true

        - name: Check audit results
          working-directory: ./${{ matrix.component }}
          run: |
            FILE=npm-audit-${{ matrix.component }}.json
            if [ ! -f "$FILE" ]; then
            echo "❌ Audit file missing — npm audit failed"
            exit 1
            fi
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' "$FILE")
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' "$FILE")
            echo "High: $HIGH"
            echo "Critical: $CRITICAL"
            if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Vulnerabilities found in ${{ matrix.component }}"
            jq '.vulnerabilities' "$FILE"
            exit 1
            fi
            echo "✅ SCA Passed for ${{ matrix.component }}"

        - name: Upload audit results
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: sca-results-${{ matrix.component }}
            path: ${{ matrix.component }}/npm-audit-${{ matrix.component }}.json

  # ====================
  # CONTAINER SECURITY SCAN
  # ====================
  container-scan:
    name: Container Image Security
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build image for scanning
        run: |
          docker-compose build ${{ matrix.image }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ramirachdi/booking-${{ matrix.image }}:latest'
          format: 'json'
          output: 'trivy-${{ matrix.image }}-results.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      
      - name: Check Trivy results
        run: |
          if [ -f trivy-${{ matrix.image }}-results.json ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-${{ matrix.image }}-results.json)
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-${{ matrix.image }}-results.json)
            
            echo "Critical vulnerabilities in ${{ matrix.image }}: $CRITICAL"
            echo "High vulnerabilities in ${{ matrix.image }}: $HIGH"
            
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ Container Scan Failed: Critical vulnerabilities in ${{ matrix.image }} image"
              exit 1
            fi
          fi
          echo "✅ Container Scan Passed for ${{ matrix.image }}"
      
      - name: Upload Trivy results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: trivy-results-${{ matrix.image }}
          path: trivy-${{ matrix.image }}-results.json

  # ====================
  # DEPLOY EPHEMERAL ENVIRONMENT
  # ====================
  deploy-ephemeral:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan, container-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Start application
        run: |
          docker-compose up -d
          echo "⏳ Waiting for services to be ready..."
          sleep 45
      
      - name: Check services health
        run: |
          echo "Checking service status..."
          docker-compose ps
          
          echo "Testing frontend..."
          curl -f http://localhost:3000 || (echo "❌ Frontend not responding" && exit 1)
          
          echo "Testing backend..."
          curl -f http://localhost:5000/api/health || (echo "❌ Backend not responding" && exit 1)
          
          echo "✅ All services are healthy"
      
      - name: Display application logs
        if: always()
        run: |
          echo "=== Backend Logs ==="
          docker-compose logs backend
          echo "=== Frontend Logs ==="
          docker-compose logs frontend

  # ====================
  # DAST - DYNAMIC SECURITY TESTING
  # ====================
  dast-scan:
    name: DAST - Runtime Security Testing
    runs-on: ubuntu-latest
    needs: deploy-ephemeral
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Start application for DAST
        run: |
          docker-compose up -d
          sleep 45
      
      - name: Verify application is running
        run: |
          curl -f http://localhost:3000 || exit 1
          curl -f http://localhost:5000/api/health || exit 1
      
      - name: Run OWASP ZAP Baseline Scan on Frontend
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:3000'
          allow_issue_writing: false
          fail_action: false
        continue-on-error: true
      
      - name: Run OWASP ZAP API Scan on Backend
        run: |
          docker run --network host -v $(pwd):/zap/wrk/:rw \
            owasp/zap2docker-stable zap-api-scan.py \
            -t http://localhost:5000/api \
            -f openapi \
            -r zap-api-report.html \
            -w zap-api-report.md \
            -J zap-api-report.json \
            -z "-config api.disablekey=true"
        continue-on-error: true
      
      - name: Analyze ZAP results
        run: |
          if [ -f zap-api-report.json ]; then
            echo "Analyzing DAST results..."
            
            # Count high and critical alerts
            HIGH_ALERTS=$(cat zap-api-report.json | jq -r '.site[0].alerts[]? | select(.riskcode == "3") | .name' | wc -l)
            CRITICAL_ALERTS=$(cat zap-api-report.json | jq -r '.site[0].alerts[]? | select(.riskcode == "4") | .name' | wc -l)
            
            echo "High severity alerts: $HIGH_ALERTS"
            echo "Critical severity alerts: $CRITICAL_ALERTS"
            
            # Display vulnerabilities if found
            if [ "$HIGH_ALERTS" -gt 0 ] || [ "$CRITICAL_ALERTS" -gt 0 ]; then
              echo "❌ DAST vulnerabilities detected:"
              cat zap-api-report.json | jq -r '.site[0].alerts[]? | select(.riskcode == "3" or .riskcode == "4") | "- \(.name) (\(.riskdesc))"'
              exit 1
            fi
          fi
          echo "✅ DAST Passed: No critical vulnerabilities in running application"
      
      - name: Upload ZAP reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: zap-reports
          path: |
            zap-api-report.html
            zap-api-report.md
            zap-api-report.json
      
      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # ====================
  # SECURITY SUMMARY
  # ====================
  security-summary:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [sast-scan, sca-scan, container-scan, dast-scan]
    if: always()
    steps:
      - name: Generate Security Report
        run: |
          echo "# 🔒 Security CI/CD Pipeline Report"
          echo ""
          echo "## Security Checks Status"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| SAST (Static Analysis) | ${{ needs.sast-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
          echo "| SCA (Dependencies) | ${{ needs.sca-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
          echo "| Container Security | ${{ needs.container-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
          echo "| DAST (Runtime Analysis) | ${{ needs.dast-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
          echo ""
          
          if [ "${{ needs.sast-scan.result }}" == "success" ] && \
             [ "${{ needs.sca-scan.result }}" == "success" ] && \
             [ "${{ needs.container-scan.result }}" == "success" ] && \
             [ "${{ needs.dast-scan.result }}" == "success" ]; then
            echo "## ✅ All Security Checks Passed"
            echo "The application is ready for deployment."
            exit 0
          else
            echo "## ❌ Security Checks Failed"
            echo "Please fix the vulnerabilities before deploying."
            exit 1
          fi


