name: Security CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ====================
  # BUILD JOB
  # ====================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build
      
      - name: Run basic tests
        run: |
          echo "✅ Build completed successfully"

  # ====================
  # SAST - STATIC ANALYSIS
  # ====================
  sast-scan:
    name: SAST - Static Code Analysis
    runs-on: ubuntu-latest
    needs: build
    permissions:
        contents: read
        security-events: write

    steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Install Semgrep
          run: |
            python3 -m pip install semgrep

        - name: Run Semgrep (SARIF output)
          run: |
            semgrep --config p/security-audit \
                    --config p/owasp-top-ten \
                    --config p/javascript \
                    --config p/typescript \
                    --config p/nodejs \
                    --config p/react \
                    --sarif --output semgrep.sarif || true

        - name: Upload SARIF to GitHub Security
          uses: github/codeql-action/upload-sarif@v4
          if: always()
          with:
            sarif_file: semgrep.sarif

        - name: Check for critical vulnerabilities
          run: |
            if [ ! -f semgrep.sarif ]; then
            echo "❌ SARIF file missing. Semgrep did not produce output."
            exit 1
            fi

            CRITICAL_COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
            echo "Critical vulnerabilities found: $CRITICAL_COUNT"

            if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ SAST Failed: $CRITICAL_COUNT critical vulnerabilities detected"
            jq '.runs[].results[] | select(.level == "error") |
                {rule: .ruleId, message: .message.text,
                location: .locations[0].physicalLocation.artifactLocation.uri}' semgrep.sarif
            exit 1
            fi

            echo "✅ SAST Passed: No critical vulnerabilities"

  # ====================
  # SCA - DEPENDENCY ANALYSIS
  # ====================
  sca-scan:
    name: SCA - Dependency Security
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ./${{ matrix.component }}
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./${{ matrix.component }}
        run: |
          npm audit --audit-level=high --json > npm-audit-${{ matrix.component }}.json || true
      
      - name: Check audit results
        working-directory: ./${{ matrix.component }}
        run: |
          if [ -f npm-audit-${{ matrix.component }}.json ]; then
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-${{ matrix.component }}.json)
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-${{ matrix.component }}.json)
            
            echo "High vulnerabilities: $HIGH"
            echo "Critical vulnerabilities: $CRITICAL"
            
            if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
              echo "❌ SCA Failed for ${{ matrix.component }}: High/Critical vulnerabilities found"
              jq '.vulnerabilities' npm-audit-${{ matrix.component }}.json
              exit 1
            fi
          fi
          echo "✅ SCA Passed for ${{ matrix.component }}"
      
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-results-${{ matrix.component }}
          path: ${{ matrix.component }}/npm-audit-${{ matrix.component }}.json
